<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bash Hunter - Terminal</title>
</head>
<body>
    <div id="terminal"></div>

   <script>
    console.log("dentro script")
        // ==========================================
        // 1. MOTOR DE EFEITO SONORO DO TECLADO (CORRIGIDO)
        // ==========================================
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playKeySound() {
            // Se o contexto não foi criado ou o navegador bloqueou, ignora para não dar erro no console
            if (!audioCtx || audioCtx.state === 'suspended') return;

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.type = 'triangle'; 
            
            // Tom de clique mecânico estalado com variação sutil
            const frequency = 500 + Math.random() * 120; 
            osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);

            // Volume e tempo de decaimento curtíssimo (estalo seco)
            gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime); 
            gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.03);

            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.03);
        }

        // CORREÇÃO: Destrava o áudio no primeiro clique do mouse na tela
        window.addEventListener('click', initAudio, { once: true });

        // Escuta o teclado e garante a inicialização do áudio caso o usuário use o TAB ou digite direto
        window.addEventListener('keydown', function(e) {
            initAudio(); // Força o resume a cada interação por segurança

            if (e.key !== 'Shift' && e.key !== 'Control' && e.key !== 'Alt') {
                playKeySound();
            }
        });

        // ==========================================
        // 2. SEUS SCRIPTS DE SEGURANÇA E REDIRECIONAMENTO (MANTIDOS IGUAIS)
        // ==========================================
        const OriginalWebSocket = window.WebSocket;
        window.WebSocket = function(url, protocols){
            const ws = new OriginalWebSocket(url, protocols);
            ws.addEventListener("error", function(e){
                e.preventDefault();     
            });
            return ws;
        };

        window.addEventListener("unhandledrejection", function(event){
            if(event.reason && event.reason.message && event.reason.message.includes("not valid JSON")){
                event.preventDefault();
            }       
        });

        window.addEventListener("beforeunload", function(e){
            window.location.href = "http://bashhunter.com.br/";     
        });

        const observar = new MutationObserver((mutations) => {
            if(document.body.innerText.includes("Press ⏎ to Reconnect") || document.body.innerText.includes("Press ↵ to Reconnect") || document.querySelector(".xterm-overlay")){
                observar.disconnect();
                console.log("Redirecionando em 3 segundos para página inicial.");
                setTimeout(() => {
                    window.location.href = "http://bashhunter.com.br/"; 
                }, 3000);
            }
        });

        window.addEventListener("DOMContentLoaded", () => {
            observar.observe(document.body, { childList: true, subtree: true });     
        });
    </script>
</body>
</html>
